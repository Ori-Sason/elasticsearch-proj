services:
  postgres:
    image: postgres:18.6
    container_name: pg-fts
    environment:
      - POSTGRES_USER=fts
      - POSTGRES_PASSWORD=fts
      - POSTGRES_DB=logs_fts
    ports:
      - "5432:5432"
    volumes:
      - pg-fts-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fts -d logs_fts"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg-fts-data: {}
