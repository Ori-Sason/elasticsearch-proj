services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: es-logs
    environment:
      - discovery.type=single-node
      # Dev-only: disables auth/TLS. A real deployment must not do this.
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    # Hard cap on top of the JVM heap: without this, off-heap memory
    # (mmap/direct buffers) can grow unbounded on a memory-constrained host.
    mem_limit: 1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana-logs
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Kibana's Node process has no default cap; without this it can
      # grow past what a small VM can spare.
      - NODE_OPTIONS=--max-old-space-size=768
    mem_limit: 1g
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data: {}
